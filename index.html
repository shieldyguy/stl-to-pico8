<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICO-8 3D Model Import Tool</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        margin: 20px;
        background-color: #111;
        color: #eee;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1,
      h2 {
        color: #5af78e;
        font-family: "Courier New", monospace;
        font-weight: bold;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
      }

      h1 {
        font-size: 28px;
      }

      section {
        margin-bottom: 30px;
        background-color: #1a1a1a;
        padding: 15px;
        border: 1px solid #333;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      #viewer-placeholder {
        width: 256px;
        height: 256px;
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #555;
      }

      #grid-size-display {
        margin-left: 10px;
        font-weight: bold;
        color: #5af78e;
      }

      button {
        background-color: #222;
        color: #0f0;
        border: 2px solid #0f0;
        font-family: "Courier New", monospace;
        font-weight: bold;
        padding: 8px 15px;
        margin: 5px 0;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s;
        box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
      }

      button:hover {
        background-color: #333;
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        background-color: #222;
        color: #555;
        border-color: #555;
        box-shadow: none;
        cursor: not-allowed;
      }

      input[type="file"] {
        background-color: #222;
        color: #eee;
        border: 1px solid #444;
        padding: 5px;
        border-radius: 0px;
        cursor: pointer;
      }

      input[type="range"] {
        width: 200px;
        margin-right: 10px;
        accent-color: #0f0;
      }

      input[type="checkbox"] {
        accent-color: #0f0;
      }

      .file-upload-button {
        display: inline-block;
        background-color: #222;
        color: #0f0;
        border: 2px solid #0f0;
        font-family: "Courier New", monospace;
        font-weight: bold;
        padding: 8px 15px;
        margin: 5px 0;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s;
        box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
      }

      .file-upload-button:hover {
        background-color: #333;
      }

      .file-upload-button:active {
        transform: translateY(1px);
      }

      #lua-output {
        background-color: #1a1a1a;
        color: #0f0;
        border: 1px solid #444;
        padding: 10px;
        font-family: "Courier New", monospace;
        border-radius: 3px;
        width: 100%;
        resize: vertical;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }

      #file-info {
        color: #5af78e;
        margin-top: 8px;
      }

      #warnings {
        color: #ff6e67;
      }

      select {
        background-color: #222;
        color: #eee;
        border: 1px solid #444;
        padding: 5px;
        border-radius: 3px;
        font-family: "Courier New", monospace;
      }

      /* DOS-inspired scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #222;
      }

      ::-webkit-scrollbar-thumb {
        background: #0f0;
        border-radius: 0;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #00ff00;
      }

      /* PICO-8 player styles from text.html */
      canvas#canvas {
        width: 100%;
        max-width: 1024px;
        height: auto;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .pico8_el {
        float: left;
        width: 85px;
        display: inline-block;
        margin: 1px;
        padding: 4px;
        text-align: center;
        color: #fff;
        background-color: #777;
        font-family: verdana;
        font-size: 9pt;
        cursor: pointer;
      }
      .pico8_el a {
        text-decoration: none;
        color: #fff;
      }
      .pico8_el:hover {
        background-color: #aaa;
      }
      .pico8_el:link {
        background-color: #aaa;
      }
    </style>
  </head>

  <body>
    <h1>PICO-8 3D Model Import Tool</h1>

    <section id="upload-section">
      <h2>Upload Model</h2>
      <label for="file-input" class="file-upload-button">Choose File</label>
      <input
        type="file"
        id="file-input"
        accept=".stl,.obj"
        style="display: none"
      />

      <div id="file-info"></div>
    </section>

    <section id="stats-section">
      <h2>Model Stats</h2>
      <p id="vertex-count">Vertices: 0</p>
      <p id="face-count">Faces: 0</p>
    </section>

    <section id="decimation-controls">
      <h2>Decimation</h2>
      <label for="grid-size-slider">Grid Size:</label>
      <input
        type="range"
        id="grid-size-slider"
        min="0.01"
        max="1.0"
        step="0.01"
        value="0.1"
      />
      <span id="grid-size-display">0.10</span>
      <button id="decimate-button">Decimate</button>
      <p id="pico-vertex-count">PICO Vertices: 0</p>
      <p id="pico-face-count">PICO Faces: 0</p>
      <p id="warnings"></p>
      <button id="send-to-pico8-button" style="margin-top: 10px" disabled>
        Send to PICO-8
      </button>
    </section>

    <section id="viewer-section">
      <h2>Model Viewer</h2>
      <div id="pico8-container">
        <!-- PICO-8 player setup exactly like in text.html -->
        <div style="width: 512px">
          <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
          ></canvas>

          <script type="text/javascript">
            var canvas = document.getElementById("canvas");
            canvas.width = 512;
            canvas.height = 512;

            // Show Emscripten environment where the canvas is
            // Arguments are passed to PICO-8
            var Module = {
              arguments: ["-width", "512", "-height", "512"],
            };
            Module.canvas = canvas;
          </script>

          <!-- PICO-8 player JS (generated from PICO-8) -->
          <script async type="text/javascript" src="model_viewer.js"></script>

          <script>
            // Key blocker - prevent cursor keys from scrolling page while playing cart
            function onKeyDown_blocker(event) {
              event = event || window.event;
              var o = document.activeElement;
              if (!o || o == document.body || o.tagName == "canvas") {
                if ([9, 32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                  if (event.preventDefault) event.preventDefault();
                }
              }
            }
            document.addEventListener("keydown", onKeyDown_blocker, false);
          </script>

          <br />

          <br />
        </div>
      </div>
      <div id="viewer-controls" style="margin-top: 10px; display: block">
        <label><input type="checkbox" id="toggle-wireframe" /> Wireframe</label>
        <label
          ><input type="checkbox" id="toggle-fill" checked /> Fill Faces</label
        >
        <label>
          Color:
          <select id="model-color">
            <option value="7">White</option>
            <option value="8">Red</option>
            <option value="11">Blue</option>
            <option value="3" selected>Green</option>
            <option value="10">Yellow</option>
            <option value="14">Pink</option>
          </select>
        </label>
        <label>
          Circle Size:
          <input
            type="number"
            id="circle-radius-divisor"
            min="0.5"
            max="10"
            step="0.1"
            value="4.5"
            style="
              background-color: #222;
              color: #eee;
              border: 1px solid #444;
              padding: 5px;
              width: 60px;
              font-family: 'Courier New', monospace;
            "
          />
        </label>
        <div style="margin-top: 10px">
          <label>
            Render Mode:
            <select
              id="render-mode"
              style="
                background-color: #222;
                color: #eee;
                border: 1px solid #444;
                padding: 5px;
                font-family: 'Courier New', monospace;
              "
            >
              <option value="0" selected>Circles</option>
              <option value="1">Triangles</option>
              <option value="2">Squares</option>
            </select>
          </label>
          <label style="margin-left: 10px">
            <input type="checkbox" id="toggle-fill-mode" checked /> Filled
            Shapes
          </label>
        </div>
      </div>
    </section>

    <section id="lua-export">
      <h2>Lua Export</h2>
      <button id="export-lua-button">Export Lua</button>
      <textarea
        id="lua-output"
        rows="10"
        style="width: 100%; margin-top: 10px"
      ></textarea>
    </section>

    <!-- Add communic8.min.js to the document -->
    <script src="communic8.min.js"></script>

    <!-- Simple communic8 integration that matches the demo -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Get references to UI controls
        const wireframeCheckbox = document.getElementById("toggle-wireframe");
        const fillCheckbox = document.getElementById("toggle-fill");
        const colorSelect = document.getElementById("model-color");

        // Simple communic8 setup (similar to text-example.js)
        var bridge = Communic8.connect();

        // Define RPC functions
        var setWireframe = Communic8.RPC({
          id: 0,
          input: [Communic8.ArgTypes.Boolean],
          output: [],
        });

        var getWireframeState = Communic8.RPC({
          id: 1,
          input: [],
          output: [Communic8.ArgTypes.Boolean],
        });

        var setFill = Communic8.RPC({
          id: 2,
          input: [Communic8.ArgTypes.Boolean],
          output: [],
        });

        var setColor = Communic8.RPC({
          id: 3,
          input: [Communic8.ArgTypes.Byte],
          output: [],
        });

        var setCircleRadiusDivisor = Communic8.RPC({
          id: 8,
          input: [Communic8.ArgTypes.Number],
          output: [],
        });

        var setRenderMode = Communic8.RPC({
          id: 9,
          input: [Communic8.ArgTypes.Byte],
          output: [],
        });

        var setFillMode = Communic8.RPC({
          id: 10,
          input: [Communic8.ArgTypes.Boolean],
          output: [],
        });

        // Track last sent states to avoid loops
        var lastSentWireframeState = null;
        var lastSentFillState = null;
        var lastSentColorValue = null;
        var lastSentRadiusDivisorValue = null;
        var lastSentRenderModeValue = null;
        var lastSentFillModeValue = null;

        // Define RPC functions for model transfer
        var startModelTransfer = Communic8.RPC({
          id: 4, // Assign a new ID
          input: [Communic8.ArgTypes.Number, Communic8.ArgTypes.Number], // vertex_count, face_count
          output: [],
        });

        var sendVertexChunk = Communic8.RPC({
          id: 5, // Assign a new ID
          input: [
            Communic8.ArgTypes.Number,
            Communic8.ArgTypes.Array(Communic8.ArgTypes.String),
          ],
          output: [],
        });

        var sendFaceChunk = Communic8.RPC({
          id: 6, // Assign a new ID
          input: [
            Communic8.ArgTypes.Number,
            Communic8.ArgTypes.Array(Communic8.ArgTypes.Number),
          ], // chunk_index, face_data_chunk [f1v1, f1v2, f1v3, ...]
          output: [],
        });

        var endModelTransfer = Communic8.RPC({
          id: 7, // Assign a new ID
          input: [],
          output: [],
        });

        // Add event listener to wireframe checkbox
        wireframeCheckbox.addEventListener("change", function (event) {
          const isChecked = event.target.checked;
          if (isChecked !== lastSentWireframeState) {
            lastSentWireframeState = isChecked;
            bridge.send(setWireframe(isChecked));
          }
        });

        // Add event listener to fill checkbox
        fillCheckbox.addEventListener("change", function (event) {
          const isChecked = event.target.checked;
          if (isChecked !== lastSentFillState) {
            lastSentFillState = isChecked;
            bridge.send(setFill(isChecked));
          }
        });

        // Add event listener to color selector
        colorSelect.addEventListener("change", function (event) {
          const colorValue = parseInt(event.target.value, 10);
          if (colorValue !== lastSentColorValue) {
            lastSentColorValue = colorValue;
            bridge.send(setColor(colorValue));
          }
        });

        // Add event listener to circle radius divisor input
        document
          .getElementById("circle-radius-divisor")
          .addEventListener("input", function (event) {
            const radiusDivisor = parseFloat(event.target.value);
            if (radiusDivisor !== lastSentRadiusDivisorValue) {
              lastSentRadiusDivisorValue = radiusDivisor;
              bridge.send(setCircleRadiusDivisor(radiusDivisor));
            }
          });

        // Add event listener to render mode selector
        document
          .getElementById("render-mode")
          .addEventListener("change", function (event) {
            const renderMode = parseInt(event.target.value, 10);
            if (renderMode !== lastSentRenderModeValue) {
              lastSentRenderModeValue = renderMode;
              bridge.send(setRenderMode(renderMode));
            }
          });

        // Add event listener to fill mode checkbox
        document
          .getElementById("toggle-fill-mode")
          .addEventListener("change", function (event) {
            const fillMode = event.target.checked;
            if (fillMode !== lastSentFillModeValue) {
              lastSentFillModeValue = fillMode;
              bridge.send(setFillMode(fillMode));
            }
          });

        // Send initial defaults once on load
        const initialFillChecked = fillCheckbox.checked;
        const initialWireframeChecked = wireframeCheckbox.checked;
        const initialColorValue = parseInt(colorSelect.value, 10);
        const initialRadiusDivisor = parseFloat(
          document.getElementById("circle-radius-divisor").value
        );
        const initialRenderMode = parseInt(
          document.getElementById("render-mode").value,
          10
        );
        const initialFillMode =
          document.getElementById("toggle-fill-mode").checked;

        lastSentFillState = initialFillChecked;
        lastSentWireframeState = initialWireframeChecked;
        lastSentColorValue = initialColorValue;
        lastSentRadiusDivisorValue = initialRadiusDivisor;
        lastSentRenderModeValue = initialRenderMode;
        lastSentFillModeValue = initialFillMode;

        bridge.send(setFill(initialFillChecked));
        bridge.send(setWireframe(initialWireframeChecked));
        bridge.send(setColor(initialColorValue));
        bridge.send(setCircleRadiusDivisor(initialRadiusDivisor));
        bridge.send(setRenderMode(initialRenderMode));
        bridge.send(setFillMode(initialFillMode));

        // Poll the wireframe state from PICO-8
        function pollWireframeState() {
          bridge.send(getWireframeState(), function (result) {
            if (result && result.length > 0) {
              const picoWireframeState = result[0];
              if (wireframeCheckbox.checked !== picoWireframeState) {
                wireframeCheckbox.checked = picoWireframeState;
                lastSentWireframeState = picoWireframeState;
              }
            }
          });
        }

        // Poll every 250ms
        setInterval(pollWireframeState, 250);

        // Add click listener for the Send to PICO-8 button (MOVED HERE)
        document
          .getElementById("send-to-pico8-button")
          .addEventListener("click", async () => {
            const modelToSend = window.decimatedModel || window.dedupedModel;
            if (!modelToSend) {
              console.error("No model data available to send.");
              alert("No model data loaded or processed yet!");
              return;
            }

            const button = document.getElementById("send-to-pico8-button");
            button.disabled = true;
            button.textContent = "Sending...";
            console.log("Starting model transfer...");

            try {
              // 1. Prepare data
              const vertexCount = modelToSend.vertices.length;
              const faceCount = modelToSend.faces.length;

              // Flatten vertices: [x1_str, y1_str, z1_str, x2_str, y2_str, z2_str, ...]
              const flatVertices = [];
              modelToSend.vertices.forEach((v) => {
                // Convert directly to string with desired precision
                flatVertices.push(v.x.toFixed(2));
                flatVertices.push(v.y.toFixed(2));
                flatVertices.push(v.z.toFixed(2));
              });

              // Flatten faces: [f1v1, f1v2, f1v3, f2v1, f2v2, f2v3, ...] (already 1-based)
              const flatFaces = [];
              modelToSend.faces.forEach((f) => {
                flatFaces.push(f[0]);
                flatFaces.push(f[1]);
                flatFaces.push(f[2]);
              });

              // 2. Send start signal
              console.log(
                `Sending startModelTransfer(${vertexCount}, ${faceCount})`
              );
              await bridge.send(startModelTransfer(vertexCount, faceCount)); // Use await for simplicity

              // 3. Send vertex chunks
              const VERTEX_CHUNK_SIZE = 8 * 3; // 8 vertices per chunk (24 numbers)
              console.log(
                `Sending ${vertexCount} vertices in chunks of ${
                  VERTEX_CHUNK_SIZE / 3
                }...`
              );
              for (let i = 0; i < flatVertices.length; i += VERTEX_CHUNK_SIZE) {
                const chunkIndex = Math.floor(i / VERTEX_CHUNK_SIZE);
                const chunk = flatVertices.slice(i, i + VERTEX_CHUNK_SIZE);
                console.log(
                  `  Sending vertex chunk ${chunkIndex} (${
                    chunk.length / 3
                  } vertices)`
                );
                await bridge.send(sendVertexChunk(chunkIndex, chunk));
                // Optional small delay if needed, communic8 handles buffering
                // await new Promise(resolve => setTimeout(resolve, 10));
              }
              console.log("Vertex chunks sent.");

              // 4. Send face chunks
              const FACE_CHUNK_SIZE = 8 * 3; // 8 faces per chunk (24 numbers)
              console.log(
                `Sending ${faceCount} faces in chunks of ${
                  FACE_CHUNK_SIZE / 3
                }...`
              );
              for (let i = 0; i < flatFaces.length; i += FACE_CHUNK_SIZE) {
                const chunkIndex = Math.floor(i / FACE_CHUNK_SIZE);
                const chunk = flatFaces.slice(i, i + FACE_CHUNK_SIZE);
                console.log(
                  `  Sending face chunk ${chunkIndex} (${
                    chunk.length / 3
                  } faces)`
                );
                await bridge.send(sendFaceChunk(chunkIndex, chunk));
                // Optional small delay
                // await new Promise(resolve => setTimeout(resolve, 10));
              }
              console.log("Face chunks sent.");

              // 5. Send end signal
              console.log("Sending endModelTransfer()");
              await bridge.send(endModelTransfer());

              console.log("Model transfer complete.");
              button.textContent = "Sent!";
              setTimeout(() => {
                button.textContent = "Send to PICO-8";
                button.disabled = false; // Re-enable after a short delay
              }, 1500);
            } catch (error) {
              console.error("Error during model transfer:", error);
              alert("Error sending model data to PICO-8. Check console.");
              button.textContent = "Transfer Failed";
              setTimeout(() => {
                // Reset button after error
                button.textContent = "Send to PICO-8";
                // Only re-enable if a model is still loaded
                button.disabled = !(
                  window.decimatedModel || window.dedupedModel
                );
              }, 2000);
            }
          }); // End of send-to-pico8-button listener
      }); // End of DOMContentLoaded listener
    </script>

    <script>
      const PICO_VERTEX_LIMIT = 256;
      const PICO_FACE_LIMIT = 512;

      // Grid size slider update
      document
        .getElementById("grid-size-slider")
        .addEventListener("input", (event) => {
          document.getElementById("grid-size-display").textContent = parseFloat(
            event.target.value
          ).toFixed(2);
        });

      // Decimate button behavior
      document
        .getElementById("decimate-button")
        .addEventListener("click", () => {
          const gridSize = parseFloat(
            document.getElementById("grid-size-slider").value
          );
          if (!window.dedupedModel) return;
          const decimated = decimateModel(window.dedupedModel, gridSize);
          displayPicoModelStats(decimated);
          window.decimatedModel = decimated;

          // Re-run warning checks after decimation
          const warnings = document.getElementById("warnings");
          const warningMessages = [];
          if (decimated.vertices.length > PICO_VERTEX_LIMIT) {
            warningMessages.push(
              `❗ Too many vertices for PICO-8 (max ${PICO_VERTEX_LIMIT})`
            );
          }
          if (decimated.faces.length > PICO_FACE_LIMIT) {
            warningMessages.push(
              `❗ Too many faces for PICO-8 (max ${PICO_FACE_LIMIT})`
            );
          }
          warnings.textContent =
            warningMessages.length > 0 ? warningMessages.join("\n") : "";

          // Enable the send button now that we have a processed model
          document.getElementById("send-to-pico8-button").disabled = false;
        });

      // Export Lua button behavior
      document
        .getElementById("export-lua-button")
        .addEventListener("click", () => {
          const modelToExport = window.decimatedModel || window.dedupedModel;
          if (modelToExport) {
            exportToLua(modelToExport);
          } else {
            console.error("No model available to export.");
            document.getElementById("lua-output").value =
              "-- No model loaded --";
          }
        });

      // File input behavior
      document
        .getElementById("file-input")
        .addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;

          const fileInfo = document.getElementById("file-info");
          fileInfo.textContent = `Loaded file: ${file.name} (${(
            file.size / 1024
          ).toFixed(2)} KB)`;

          const reader = new FileReader();
          reader.onload = function (e) {
            const contents = e.target.result;
            let format = detectFormat(file, contents);

            const warnings = document.getElementById("warnings");
            warnings.textContent = `Detected format: ${format}`;

            if (format === "stl-ascii") {
              const rawModel = parseSTLAscii(contents);
              displayModelStats(rawModel);

              const dedupedModel = deduplicateVertices(rawModel);
              window.dedupedModel = dedupedModel;
              displayPicoModelStats(dedupedModel);

              const warningMessages = [];
              if (dedupedModel.vertices.length > PICO_VERTEX_LIMIT) {
                warningMessages.push(
                  `❗ Too many vertices for PICO-8 (max ${PICO_VERTEX_LIMIT})`
                );
              }
              if (dedupedModel.faces.length > PICO_FACE_LIMIT) {
                warningMessages.push(
                  `❗ Too many faces for PICO-8 (max ${PICO_FACE_LIMIT})`
                );
              }
              warnings.textContent = warningMessages.join("\n");
            }
          };
          reader.readAsText(file);
        });

      function detectFormat(file, contents) {
        if (contents.startsWith("solid") || contents.includes("facet normal")) {
          return "stl-ascii";
        } else if (file.name.endsWith(".stl")) {
          return "stl-binary";
        } else if (file.name.endsWith(".obj")) {
          return "obj";
        }
        return "unknown";
      }

      function parseSTLAscii(contents) {
        const vertices = [];
        const faces = [];
        const lines = contents.split("\n");
        let currentFace = [];

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith("vertex")) {
            const parts = line.split(/\s+/);
            const v = {
              x: parseFloat(parts[1]),
              y: parseFloat(parts[2]),
              z: parseFloat(parts[3]),
            };
            vertices.push(v);
            currentFace.push(vertices.length);
            if (currentFace.length === 3) {
              faces.push([...currentFace]);
              currentFace = [];
            }
          }
        }
        return { vertices, faces };
      }

      function deduplicateVertices(model) {
        const uniqueVerts = [];
        const vertMap = new Map();
        const newFaces = [];

        model.faces.forEach((face) => {
          const newFace = face.map((index) => {
            const v = model.vertices[index - 1];
            const key = `${v.x.toFixed(4)}_${v.y.toFixed(4)}_${v.z.toFixed(4)}`;
            if (!vertMap.has(key)) {
              vertMap.set(key, uniqueVerts.length + 1);
              uniqueVerts.push(v);
            }
            return vertMap.get(key);
          });
          newFaces.push(newFace);
        });

        return { vertices: uniqueVerts, faces: newFaces };
      }

      function displayModelStats(model) {
        document.getElementById(
          "vertex-count"
        ).textContent = `Vertices: ${model.vertices.length}`;
        document.getElementById(
          "face-count"
        ).textContent = `Faces: ${model.faces.length}`;
      }

      function displayPicoModelStats(model) {
        document.getElementById(
          "pico-vertex-count"
        ).textContent = `PICO Vertices: ${model.vertices.length}`;
        document.getElementById(
          "pico-face-count"
        ).textContent = `PICO Faces: ${model.faces.length}`;
      }

      function exportToLua(model) {
        if (!model) return;
        let lua = "vertices={\n";
        model.vertices.forEach((v) => {
          lua += `{x=${v.x.toFixed(2)},y=${v.y.toFixed(2)},z=${v.z.toFixed(
            2
          )}},\n`;
        });
        lua += "}\nfaces={\n";
        model.faces.forEach((f) => {
          lua += `{${f[0]},${f[1]},${f[2]}},\n`;
        });
        lua += "}";
        document.getElementById("lua-output").value = lua;
      }

      function decimateModel(model, gridSize = 0.1) {
        const gridMap = new Map();
        const simplifiedVerts = [];
        const indexMap = new Map();
        let currentIndex = 1;

        function quantize(v) {
          return [
            Math.round(v.x / gridSize),
            Math.round(v.y / gridSize),
            Math.round(v.z / gridSize),
          ].join("_");
        }

        const newFaces = [];
        model.faces.forEach((face) => {
          const indices = face.map((index) => {
            const v = model.vertices[index - 1];
            const key = quantize(v);
            if (!gridMap.has(key)) {
              gridMap.set(key, currentIndex);
              indexMap.set(currentIndex, v);
              currentIndex++;
            }
            return gridMap.get(key);
          });

          const [a, b, c] = indices;
          if (a !== b && b !== c && a !== c) {
            newFaces.push(indices);
          }
        });

        gridMap.forEach((idx, key) => {
          simplifiedVerts[idx - 1] = indexMap.get(idx);
        });

        return { vertices: simplifiedVerts, faces: newFaces };
      }
    </script>
